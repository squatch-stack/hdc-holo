name: release

# Tag-driven publish to PyPI. There is no API token anywhere in this
# repository or its secrets: PyPI Trusted Publishing mints a
# short-lived OIDC credential scoped to this workflow on this repo, so
# the thing an attacker would steal does not exist. Setup is one-time,
# on PyPI itself (Publishing -> add a GitHub publisher):
#
#     owner squatch-stack · repo hdc-holo
#     workflow release.yml · environment pypi
#
on:
  push:
    tags: ["v*"]
  workflow_dispatch:     # dry run: builds and verifies, never publishes

permissions:
  contents: read

# Actions are pinned to full commit SHAs (tag names are mutable and a
# compromised tag is a supply-chain vector); the comment records the tag.
jobs:
  # A tag is a claim about a version, and this repo gates claims. The
  # failure this prevents is real and unfixable after the fact: PyPI
  # filenames come from the package metadata, not from the tag, so
  # tagging v0.3.1 over a tree that still says 0.3.0 uploads 0.3.0
  # again — and a version can never be re-uploaded.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag must match holo.__version__
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"',open('holo/__init__.py').read()).group(1))")"
          echo "tag=$tag  package=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $GITHUB_REF_NAME disagrees with holo.__version__ $pkg"; exit 1; }

  build:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - name: Metadata must be well formed and the license must be declared
        run: |
          twine check dist/*
          python - <<'EOF'
          import pathlib, re, tarfile
          sdist = next(pathlib.Path("dist").glob("*.tar.gz"))
          with tarfile.open(sdist) as t:
              name = next(n for n in t.getnames() if n.endswith("/PKG-INFO"))
              meta = t.extractfile(name).read().decode()
          assert re.search(r"^License: Apache-2\.0$", meta, re.M), "license metadata missing"
          assert "License :: OSI Approved :: Apache Software License" in meta, "OSI classifier missing"
          print("PKG-INFO carries the Apache-2.0 declaration and the OSI classifier")
          EOF
      # The wheel has to actually import from a clean interpreter — a
      # packaging mistake (a missing subpackage, a bad entry point)
      # passes every in-tree test and fails only for the first user.
      - name: Install the wheel into a clean interpreter
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
      # Run from OUTSIDE the checkout, and prove it: inside the repo,
      # the source `holo/` sits on sys.path ahead of site-packages and
      # this step silently validates the very tree it exists to be
      # independent of. That false pass is indistinguishable from a
      # real one by eye — it was caught locally only because the
      # version it printed was the OLD one. Hence the assertion rather
      # than a bare import.
      - name: Installed wheel must import and expose its console scripts
        working-directory: /tmp
        run: |
          /tmp/fresh/bin/python - <<'EOF'
          import holo, holo.facts, holo.quality, hdc
          assert "/tmp/fresh/" in holo.__file__, (
              "imported %s, not the installed wheel" % holo.__file__)
          print("holo", holo.__version__, "from", holo.__file__)
          EOF
          /tmp/fresh/bin/holo-facts --help > /dev/null
          /tmp/fresh/bin/holo-quality --help > /dev/null
          /tmp/fresh/bin/hdc-demos hashmap --dim 512 > /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # Publishes only for a real tag; workflow_dispatch stops after build,
  # which makes the whole pipeline safe to exercise on demand.
  pypi:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/hdc-holo
    permissions:
      id-token: write      # mint the OIDC token; nothing else is granted
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
